[project]
name = "salvai"
description = "Viu, gostou, salvaí. Baixe vídeos e músicas do YouTube, Instagram, TikTok, X e muito mais."
requires-python = ">=3.14"
dynamic = ["version"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402", "E731", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["thread"]
data_file = "build/.coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.json]
output = "build/coverage-python.json"
