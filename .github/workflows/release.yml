name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Versão e changelog
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build do Windows
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Gerar Salvai.exe e salvai-mcp.exe
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Publicar na release
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $version = $env:TAG.TrimStart("v")
            $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^\[?$([regex]::Escape($version))\b" } | Select-Object -First 1
            Set-Content notes.md ("## " + $notes) -Encoding utf8
            gh release create $env:TAG --title "Salvaí $env:TAG" --notes-file notes.md
          }
          gh release upload $env:TAG dist/Salvai.exe dist/salvai-mcp.exe dist/SHA256SUMS.txt --clobber
