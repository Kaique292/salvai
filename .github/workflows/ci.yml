name: Verificação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    name: Formatação e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Prettier
        run: yarn prettier --check .

      - name: Mensagens de commit (padrão semântico)
        if: github.event_name == 'pull_request'
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Ruff
        run: |
          pip install $(grep '^ruff==' requirements-dev.txt)
          ruff check src scripts tests
          ruff format --check src scripts tests

  testes:
    name: Testes e cobertura
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - run: yarn install --immutable

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependências Python
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Testes do aplicativo (Python)
        run: yarn test:py

      - name: Testes da interface (JavaScript)
        run: yarn test:js

      - name: Badge de cobertura atualizado
        shell: bash
        run: |
          yarn coverage:badge
          git diff --exit-code docs/badges/coverage.json
